<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>FlashEnglish · 500 palabras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#22312A;
    --bg-2:#1B2620;
    --paper:#F7F1DF;
    --paper-2:#EAE0C4;
    --paper-3:#DED2AE;
    --ink:#22261E;
    --muted:#9BB0A2;
    --muted-2:#5E7267;
    --accent:#E8A33D;
    --accent-ink:#3A2A0E;
    --good:#5FAE63;
    --good-ink:#173318;
    --bad:#DA5B54;
    --bad-ink:#3C1310;
    --radius:20px;
    --shadow:0 14px 34px rgba(0,0,0,.38);
    --font-display:'Fraunces',serif;
    --font-body:'Work Sans',sans-serif;
    --font-mono:'Space Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 8%, rgba(255,255,255,.05), transparent 40%),
      radial-gradient(circle at 85% 92%, rgba(255,255,255,.04), transparent 45%),
      linear-gradient(180deg, var(--bg), var(--bg-2));
    color:var(--paper);
    font-family:var(--font-body);
    -webkit-tap-highlight-color: transparent;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:520px;
    min-height:100vh;
    padding:20px 16px 40px;
    display:flex;
    flex-direction:column;
  }
  .topbar{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:18px;
    padding:0 4px;
  }
  .brand{
    font-family:var(--font-display);
    font-weight:700;
    font-size:22px;
    letter-spacing:.2px;
    color:var(--paper);
    background:none;
    border:none;
    padding:0;
    cursor:pointer;
  }
  .brand span{color:var(--accent);}
  .reset-link{
    font-family:var(--font-body);
    font-size:12px;
    color:var(--muted);
    background:none;
    border:none;
    cursor:pointer;
    text-decoration:underline;
    text-underline-offset:3px;
    padding:6px;
  }
  #view{flex:1; display:flex; flex-direction:column;}

  /* ---------- HOME ---------- */
  .home-lede{
    font-family:var(--font-body);
    color:var(--muted);
    font-size:14px;
    margin:0 4px 22px;
    line-height:1.5;
  }
  .section-label{
    font-family:var(--font-mono);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.14em;
    color:var(--muted);
    margin:0 4px 10px;
  }
  .mode-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:24px;
  }
  .mode-card{
    background:var(--paper);
    color:var(--ink);
    border-radius:var(--radius);
    padding:18px 14px;
    text-align:left;
    border:2px solid transparent;
    cursor:pointer;
    font-family:var(--font-body);
    box-shadow:var(--shadow);
    transition:transform .15s ease, border-color .15s ease;
  }
  .mode-card:active{transform:scale(.97);}
  .mode-card.selected{border-color:var(--accent);}
  .mode-card .glyph{font-size:26px; display:block; margin-bottom:10px;}
  .mode-card .title{font-weight:700; font-size:15px; margin-bottom:4px;}
  .mode-card .desc{font-size:12px; color:var(--muted-2); line-height:1.4;}

  .pill-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin:0 4px 22px;
  }
  .pill{
    font-family:var(--font-body);
    font-size:13px;
    font-weight:600;
    padding:9px 16px;
    border-radius:999px;
    background:rgba(255,255,255,.06);
    color:var(--paper);
    border:1.5px solid rgba(255,255,255,.14);
    cursor:pointer;
  }
  .pill.selected{
    background:var(--accent);
    color:var(--accent-ink);
    border-color:var(--accent);
  }

  .btn-primary{
    font-family:var(--font-body);
    font-weight:700;
    font-size:16px;
    background:var(--accent);
    color:var(--accent-ink);
    border:none;
    border-radius:14px;
    padding:16px;
    cursor:pointer;
    box-shadow:var(--shadow);
    margin:6px 4px 0;
  }
  .btn-primary:active{transform:scale(.98);}
  .btn-secondary{
    font-family:var(--font-body);
    font-weight:600;
    font-size:14px;
    background:transparent;
    color:var(--paper);
    border:1.5px solid rgba(255,255,255,.22);
    border-radius:14px;
    padding:13px;
    cursor:pointer;
    margin:10px 4px 0;
  }
  .stats-line{
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--muted);
    margin:18px 4px 0;
    text-align:center;
  }
  .pool-warning{
    font-family:var(--font-body);
    font-size:12px;
    color:var(--accent);
    margin:0 4px 14px;
  }

  /* ---------- ROUND ---------- */
  .round-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:var(--font-mono);
    font-size:13px;
    color:var(--muted);
    margin:0 4px 22px;
  }
  .round-header .timer{color:var(--paper); font-weight:700;}
  .round-header .score-live{color:var(--good);}

  .card-stack{
    position:relative;
    margin:6px 10px 26px;
    height:250px;
  }
  .card-stack .ghost{
    position:absolute;
    inset:0;
    background:var(--paper-2);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  .card-stack .ghost.g1{transform:rotate(3deg) translateY(6px); background:var(--paper-3); z-index:1;}
  .card-stack .ghost.g2{transform:rotate(-2.5deg) translateY(3px); background:var(--paper-2); z-index:2;}
  .card{
    position:absolute;
    inset:0;
    z-index:3;
    background:var(--paper);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    border:3px solid transparent;
    display:flex;
    flex-direction:column;
    padding:18px;
    transition:border-color .15s ease, border-width .15s ease, box-shadow .15s ease, transform .12s ease;
  }
  .card.is-correct{
    border:6px solid var(--good);
    box-shadow:0 0 0 6px rgba(95,174,99,.18), var(--shadow);
    animation:pop .28s ease;
  }
  .card.is-wrong{border-color:var(--bad); animation:shake .32s ease;}
  @keyframes pop{
    0%{transform:scale(1);}
    45%{transform:scale(1.035);}
    100%{transform:scale(1);}
  }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-6px);}
    75%{transform:translateX(6px);}
  }
  .card-holes{
    position:absolute;
    left:10px; top:20px; bottom:20px;
    display:flex; flex-direction:column; justify-content:space-between;
  }
  .card-holes span{
    width:10px; height:10px; border-radius:50%;
    background:var(--bg);
    box-shadow:inset 0 1px 3px rgba(0,0,0,.4);
  }
  .level-tag{
    align-self:flex-start;
    font-family:var(--font-mono);
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.1em;
    color:var(--muted-2);
    background:var(--paper-2);
    padding:4px 9px;
    border-radius:999px;
    margin-left:22px;
  }
  .card-body{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
  }
  .card-word{
    font-family:var(--font-display);
    font-weight:700;
    font-size:38px;
    color:var(--ink);
    word-break:break-word;
  }
  .card-emoji{font-size:84px; line-height:1;}

  .feedback-line{
    min-height:20px;
    text-align:center;
    font-family:var(--font-body);
    font-size:13px;
    color:var(--muted);
    margin:0 4px 10px;
  }
  .feedback-line.correct{color:var(--good);}
  .feedback-line.wrong{color:var(--bad);}
  .feedback-line b{color:var(--paper);}

  .answer-row{display:flex; gap:8px; margin:0 4px;}
  .input-answer{
    flex:1;
    font-family:var(--font-body);
    font-size:16px;
    padding:15px 16px;
    border-radius:14px;
    border:1.5px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.06);
    color:var(--paper);
    outline:none;
  }
  .input-answer:focus{border-color:var(--accent);}
  .input-answer::placeholder{color:var(--muted-2);}
  .btn-check{
    font-family:var(--font-body);
    font-weight:700;
    font-size:15px;
    padding:0 20px;
    border-radius:14px;
    border:none;
    background:var(--accent);
    color:var(--accent-ink);
    cursor:pointer;
  }
  .btn-check:disabled{opacity:.5;}
  .next-hint{
    text-align:center;
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--muted-2);
    margin-top:12px;
  }
  .answer-reveal-wrap{
    margin:0 4px 14px;
    text-align:center;
  }
  .answer-reveal{
    font-family:var(--font-display);
    font-weight:700;
    font-size:28px;
    color:var(--bad-ink);
    background:var(--paper);
    border-radius:14px;
    padding:14px 16px;
    box-shadow:var(--shadow);
    transition:color .15s ease, text-shadow .15s ease;
    word-break:break-word;
  }
  .answer-reveal.hidden-text{
    color:transparent;
    text-shadow:0 0 16px rgba(34,38,30,.65);
    user-select:none;
  }
  .btn-toggle-answer{
    font-family:var(--font-body);
    font-weight:600;
    font-size:12.5px;
    background:transparent;
    color:var(--paper);
    border:1.5px solid rgba(255,255,255,.24);
    border-radius:999px;
    padding:7px 14px;
    margin-top:10px;
    cursor:pointer;
  }

  /* ---------- RESULT ---------- */
  .result-hero{
    text-align:center;
    margin:10px 4px 24px;
  }
  .result-hero .big{
    font-family:var(--font-display);
    font-weight:700;
    font-size:52px;
    color:var(--accent);
    line-height:1;
  }
  .result-hero .sub{
    font-family:var(--font-body);
    font-size:14px;
    color:var(--muted);
    margin-top:8px;
  }
  .result-stats{
    display:flex;
    gap:10px;
    margin:0 4px 22px;
  }
  .result-stat{
    flex:1;
    background:rgba(255,255,255,.06);
    border:1.5px solid rgba(255,255,255,.1);
    border-radius:14px;
    padding:12px;
    text-align:center;
  }
  .result-stat .v{font-family:var(--font-mono); font-weight:700; font-size:18px; color:var(--paper);}
  .result-stat .l{font-family:var(--font-body); font-size:11px; color:var(--muted); margin-top:2px;}
  .missed-wrap{margin:0 4px 8px;}
  .missed-list{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
  .missed-chip{
    background:var(--paper);
    color:var(--ink);
    border-radius:10px;
    padding:8px 11px;
    font-size:12.5px;
    font-family:var(--font-body);
  }
  .missed-chip b{font-weight:700;}
  .missed-chip .es{color:var(--muted-2);}
  .empty-mistakes{
    font-family:var(--font-body);
    font-size:13px;
    color:var(--good);
    margin:0 4px;
  }

  /* ---------- MOBILE COMPACTO (para que quepa todo con el teclado abierto) ---------- */
  html{ scroll-behavior:smooth; }
  @media (max-width:480px){
    #app{ padding:12px 10px 20px; }
    .topbar{ margin-bottom:10px; }
    .round-header{ margin:0 4px 10px; font-size:12px; }
    .answer-reveal-wrap{ margin:0 4px 10px; }
    .answer-reveal{ font-size:20px; padding:9px 12px; }
    .btn-toggle-answer{ font-size:11.5px; padding:6px 12px; margin-top:6px; }
    .card-stack{ height:170px; margin:2px 6px 12px; }
    .card{ padding:12px; }
    .card-word{ font-size:26px; }
    .card-emoji{ font-size:58px; }
    .level-tag{ font-size:9px; padding:3px 8px; margin-left:18px; }
    .feedback-line{ margin:0 4px 6px; min-height:14px; font-size:12px; }
    .answer-row{ margin:0 4px; }
    .input-answer{ padding:11px 12px; font-size:16px; }
    .btn-check{ padding:0 14px; font-size:13.5px; }
    .next-hint{ margin-top:6px; font-size:9.5px; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <button class="brand" id="brandBtn" title="Volver al inicio">Flash<span>English</span></button>
    <button class="reset-link" id="resetBtn">reiniciar progreso</button>
  </div>
  <div id="view"></div>
</div>

<script>
(function(){
  "use strict";

  var DICTIONARY = JSON.parse(document.getElementById('dictionary-data').textContent);
  var LEVEL_LABELS = { basico:'Básico', intermedio:'Intermedio', avanzado:'Avanzado' };
  var PROGRESS_KEY = 'flashenglish_progress_v1';
  var view = document.getElementById('view');

  var PROGRESS = {};
  try{
    PROGRESS = JSON.parse(localStorage.getItem(PROGRESS_KEY) || '{}');
  }catch(e){ PROGRESS = {}; }

  function saveProgress(){
    try{ localStorage.setItem(PROGRESS_KEY, JSON.stringify(PROGRESS)); }catch(e){}
  }
  function getBox(en){ return PROGRESS[en] || 1; }

  var STATE = {
    mode: 'word2meaning',   // 'word2meaning' | 'image2word'
    level: 'mixto',         // 'basico' | 'intermedio' | 'mixto'
    roundSize: 20,
    queue: [],
    index: 0,
    correctCount: 0,
    mistakes: [],
    startTime: 0,
    elapsedMs: 0,
    timerId: null,
    awaitingNext: false,
    nextTimeoutId: null
  };

  function normalize(str){
    return String(str)
      .trim()
      .toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/[.,!?¡¿]/g,'')
      .replace(/\s+/g,' ');
  }

  function poolFor(mode, level){
    var pool = DICTIONARY.filter(function(w){
      if (level !== 'mixto' && w.level !== level) return false;
      if (mode === 'image2word' && !w.emoji) return false;
      return true;
    });
    return pool;
  }

  function weightForWord(w){
    var box = getBox(w.en);
    if (box <= 1) return 6;
    if (box === 2) return 3;
    return 1;
  }

  function pickRoundWords(pool, size){
    var n = Math.min(size, pool.length);
    var scored = pool.map(function(w){
      var weight = weightForWord(w);
      var r = Math.random();
      var key = Math.pow(r, 1 / weight);
      return { w: w, key: key };
    });
    scored.sort(function(a,b){ return b.key - a.key; });
    return scored.slice(0, n).map(function(s){ return s.w; });
  }

  function formatTime(ms){
    var totalSec = Math.floor(ms/1000);
    var m = Math.floor(totalSec/60);
    var s = totalSec % 60;
    return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  }

  function countMastered(){
    var c = 0;
    for (var k in PROGRESS){ if (PROGRESS[k] >= 3) c++; }
    return c;
  }

  function clearRoundTimers(){
    stopTimer();
    if (STATE.nextTimeoutId){ clearTimeout(STATE.nextTimeoutId); STATE.nextTimeoutId = null; }
    STATE.awaitingNext = false;
  }

  // ---------------- HOME ----------------
  function renderHome(){
    clearRoundTimers();
    var pool = poolFor(STATE.mode, STATE.level);
    var willUse = Math.min(STATE.roundSize, pool.length);
    var warn = '';
    if (pool.length < STATE.roundSize){
      warn = '<div class="pool-warning">Solo hay '+pool.length+' palabras disponibles para esta combinación · la ronda usará '+willUse+'.</div>';
    }

    view.innerHTML =
      '<p class="home-lede">Practica vocabulario en inglés básico, intermedio y avanzado con repetición espaciada: las palabras que fallas vuelven antes.</p>'+
      '<div class="section-label">Modo de juego</div>'+
      '<div class="mode-grid">'+
        '<button class="mode-card'+(STATE.mode==='word2meaning'?' selected':'')+'" data-mode="word2meaning">'+
          '<span class="glyph">🔤</span>'+
          '<span class="title">Palabra → Significado</span>'+
          '<span class="desc">Ves la palabra en inglés y escribes su significado en español.</span>'+
        '</button>'+
        '<button class="mode-card'+(STATE.mode==='image2word'?' selected':'')+'" data-mode="image2word">'+
          '<span class="glyph">🖼️</span>'+
          '<span class="title">Imagen → Palabra</span>'+
          '<span class="desc">Ves un ícono y escribes la palabra en inglés.</span>'+
        '</button>'+
      '</div>'+
      '<div class="section-label">Nivel</div>'+
      '<div class="pill-row" id="levelPills">'+
        pillHtml('basico','Básico', STATE.level)+
        pillHtml('intermedio','Intermedio', STATE.level)+
        pillHtml('avanzado','Avanzado', STATE.level)+
        pillHtml('mixto','Mixto', STATE.level)+
      '</div>'+
      '<div class="section-label">Palabras por ronda</div>'+
      '<div class="pill-row" id="sizePills">'+
        pillHtml(10,'10', STATE.roundSize)+
        pillHtml(20,'20', STATE.roundSize)+
        pillHtml(30,'30', STATE.roundSize)+
      '</div>'+
      warn+
      '<button class="btn-primary" id="startBtn">Empezar ronda</button>'+
      '<div class="stats-line">Dominadas: '+countMastered()+' / '+DICTIONARY.length+'</div>';

    Array.prototype.forEach.call(document.querySelectorAll('.mode-card'), function(btn){
      btn.addEventListener('click', function(){
        STATE.mode = btn.getAttribute('data-mode');
        renderHome();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('#levelPills .pill'), function(btn){
      btn.addEventListener('click', function(){
        STATE.level = btn.getAttribute('data-val');
        renderHome();
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('#sizePills .pill'), function(btn){
      btn.addEventListener('click', function(){
        STATE.roundSize = parseInt(btn.getAttribute('data-val'),10);
        renderHome();
      });
    });
    document.getElementById('startBtn').addEventListener('click', startRound);
  }

  function pillHtml(val, label, current){
    var sel = (String(val) === String(current)) ? ' selected' : '';
    return '<button class="pill'+sel+'" data-val="'+val+'">'+label+'</button>';
  }

  // ---------------- ROUND ----------------
  function startRound(){
    var pool = poolFor(STATE.mode, STATE.level);
    if (pool.length === 0){ renderHome(); return; }
    STATE.queue = pickRoundWords(pool, STATE.roundSize);
    STATE.index = 0;
    STATE.correctCount = 0;
    STATE.mistakes = [];
    STATE.elapsedMs = 0;
    STATE.startTime = Date.now();
    startTimer();
    renderRoundShell();
    showCard();
  }

  function startTimer(){
    stopTimer();
    STATE.timerId = setInterval(function(){
      STATE.elapsedMs = Date.now() - STATE.startTime;
      var t = document.getElementById('liveTimer');
      if (t) t.textContent = formatTime(STATE.elapsedMs);
    }, 250);
  }
  function stopTimer(){
    if (STATE.timerId){ clearInterval(STATE.timerId); STATE.timerId = null; }
  }

  function renderRoundShell(){
    view.innerHTML =
      '<div class="round-header">'+
        '<span id="progressLabel">1 / '+STATE.queue.length+'</span>'+
        '<span class="timer" id="liveTimer">00:00</span>'+
        '<span class="score-live" id="scoreLive">✓ 0</span>'+
      '</div>'+
      '<div class="answer-reveal-wrap">'+
        '<div class="answer-reveal hidden-text" id="answerReveal"></div>'+
        '<button class="btn-toggle-answer" id="toggleAnswerBtn">Mostrar respuesta</button>'+
      '</div>'+
      '<div class="card-stack">'+
        '<div class="ghost g1"></div>'+
        '<div class="ghost g2"></div>'+
        '<div class="card" id="card">'+
          '<div class="card-holes"><span></span><span></span><span></span></div>'+
          '<div class="level-tag" id="levelTag"></div>'+
          '<div class="card-body" id="cardBody"></div>'+
        '</div>'+
      '</div>'+
      '<div class="feedback-line" id="feedbackLine"></div>'+
      '<div class="answer-row">'+
        '<input type="text" class="input-answer" id="answerInput" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Escribe tu respuesta…">'+
        '<button class="btn-check" id="checkBtn">Comprobar</button>'+
      '</div>'+
      '<div class="next-hint">Enter para comprobar · Enter o el botón para continuar</div>';

    document.getElementById('checkBtn').addEventListener('click', primaryAction);
    var answerInputEl = document.getElementById('answerInput');
    answerInputEl.addEventListener('keydown', function(e){
      if (e.key === 'Enter'){
        e.preventDefault();
        primaryAction();
      }
    });
    answerInputEl.addEventListener('focus', function(){
      var el = this;
      setTimeout(function(){
        el.scrollIntoView({ block:'center', behavior:'smooth' });
      }, 250);
    });
    document.getElementById('toggleAnswerBtn').addEventListener('click', function(){
      var el = document.getElementById('answerReveal');
      var hidden = el.classList.toggle('hidden-text');
      this.textContent = hidden ? 'Mostrar respuesta' : 'Ocultar respuesta';
    });
  }

  function primaryAction(){
    if (STATE.awaitingNext){ advance(); } else { handleSubmit(); }
  }

  function correctAnswerFor(w){
    return STATE.mode === 'image2word' ? w.en : w.es;
  }

  function currentWord(){ return STATE.queue[STATE.index]; }

  function showCard(){
    STATE.awaitingNext = false;
    var w = currentWord();
    var cardEl = document.getElementById('card');
    cardEl.classList.remove('is-correct','is-wrong');
    document.getElementById('levelTag').textContent = LEVEL_LABELS[w.level] || w.level;
    var body = document.getElementById('cardBody');
    if (STATE.mode === 'image2word'){
      body.innerHTML = '<div class="card-emoji">'+w.emoji+'</div>';
    } else {
      body.innerHTML = '<div class="card-word">'+escapeHtml(w.en)+'</div>';
    }
    document.getElementById('feedbackLine').textContent = '';
    document.getElementById('feedbackLine').className = 'feedback-line';
    var revealEl = document.getElementById('answerReveal');
    revealEl.textContent = correctAnswerFor(w);
    revealEl.classList.add('hidden-text');
    document.getElementById('toggleAnswerBtn').textContent = 'Mostrar respuesta';
    document.getElementById('progressLabel').textContent = (STATE.index+1)+' / '+STATE.queue.length;
    document.getElementById('scoreLive').textContent = '✓ '+STATE.correctCount;
    var input = document.getElementById('answerInput');
    input.value = '';
    input.readOnly = false;
    input.focus();
    var btn = document.getElementById('checkBtn');
    btn.textContent = 'Comprobar';
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function handleSubmit(){
    if (STATE.awaitingNext) return;
    var w = currentWord();
    var input = document.getElementById('answerInput');
    var raw = input.value;

    var acceptable;
    if (STATE.mode === 'image2word'){
      acceptable = [normalize(w.en)];
    } else {
      acceptable = [normalize(w.es)].concat((w.alt||[]).map(normalize));
    }
    var ok = acceptable.indexOf(normalize(raw)) !== -1;

    var box = getBox(w.en);
    PROGRESS[w.en] = ok ? Math.min(box + 1, 3) : 1;
    saveProgress();

    var cardEl = document.getElementById('card');
    var fb = document.getElementById('feedbackLine');
    var delay;
    if (ok){
      STATE.correctCount++;
      cardEl.classList.add('is-correct');
      fb.className = 'feedback-line correct';
      fb.textContent = '¡Correcto!';
      delay = 1200;
    } else {
      STATE.mistakes.push(w);
      cardEl.classList.add('is-wrong');
      fb.className = 'feedback-line wrong';
      fb.textContent = 'Incorrecto';
      var revealEl = document.getElementById('answerReveal');
      revealEl.classList.remove('hidden-text');
      document.getElementById('toggleAnswerBtn').textContent = 'Ocultar respuesta';
      delay = 5000;
    }
    document.getElementById('scoreLive').textContent = '✓ '+STATE.correctCount;
    input.readOnly = true;
    document.getElementById('checkBtn').textContent = 'Siguiente →';
    STATE.awaitingNext = true;
    STATE.nextTimeoutId = setTimeout(advance, delay);
  }

  function advance(){
    if (STATE.nextTimeoutId){ clearTimeout(STATE.nextTimeoutId); STATE.nextTimeoutId = null; }
    STATE.index++;
    if (STATE.index >= STATE.queue.length){
      finishRound();
    } else {
      showCard();
    }
  }

  // ---------------- RESULT ----------------
  function finishRound(){
    stopTimer();
    STATE.elapsedMs = Date.now() - STATE.startTime;
    var total = STATE.queue.length;
    var acc = total ? Math.round((STATE.correctCount/total)*100) : 0;

    var missedHtml = '';
    if (STATE.mistakes.length === 0){
      missedHtml = '<p class="empty-mistakes">Ronda perfecta, ninguna palabra fallada.</p>';
    } else {
      var chips = STATE.mistakes.map(function(w){
        return '<div class="missed-chip"><b>'+escapeHtml(w.en)+'</b> <span class="es">— '+escapeHtml(w.es)+'</span></div>';
      }).join('');
      missedHtml = '<div class="missed-wrap"><div class="section-label">Para repasar</div><div class="missed-list">'+chips+'</div></div>';
    }

    view.innerHTML =
      '<div class="result-hero">'+
        '<div class="big">'+STATE.correctCount+' / '+total+'</div>'+
        '<div class="sub">'+acc+'% de aciertos</div>'+
      '</div>'+
      '<div class="result-stats">'+
        '<div class="result-stat"><div class="v">'+formatTime(STATE.elapsedMs)+'</div><div class="l">tiempo</div></div>'+
        '<div class="result-stat"><div class="v">'+STATE.mistakes.length+'</div><div class="l">falladas</div></div>'+
        '<div class="result-stat"><div class="v">'+countMastered()+'</div><div class="l">dominadas</div></div>'+
      '</div>'+
      missedHtml+
      '<button class="btn-primary" id="replayBtn">Jugar de nuevo</button>'+
      '<button class="btn-secondary" id="homeBtn">Cambiar modo / nivel</button>';

    document.getElementById('replayBtn').addEventListener('click', startRound);
    document.getElementById('homeBtn').addEventListener('click', renderHome);
  }

  // ---------------- NAV ----------------
  document.getElementById('brandBtn').addEventListener('click', renderHome);

  // ---------------- RESET ----------------
  document.getElementById('resetBtn').addEventListener('click', function(){
    if (confirm('¿Borrar todo el progreso guardado (cajas de repaso)?')){
      PROGRESS = {};
      saveProgress();
      renderHome();
    }
  });

  renderHome();
})();

</script>
</body>
</html>
